<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>サイネージ</title>
<style>
  html, body{ margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif; }

  /* 1920x1080でデザインし、実画面サイズに合わせて拡縮する */
  #screen{ width:1920px; height:1080px; transform-origin:top left; position:absolute;
    display:flex; flex-direction:column;
    --ground:#f6f8fb; --card:#ffffff; --line:#d8e1ec; --soft:#eef3f9;
    --text:#1c2a3a; --muted:#64748b;
    --fl:#f59e0b; --fl-ink:#3d2800; --fl-soft:#fef3dd;
    --dl:#0e9f9e; --dl-ink:#ffffff; --dl-soft:#dcf5f4;
    --info:#2f6fb2; --alert:#d64545; --fun:#c26bb5;
    background:var(--ground); color:var(--text); }
  #screen *{ box-sizing:border-box; }
  .num{ font-variant-numeric:tabular-nums; }

  .chip{ display:inline-block; padding:1px 10px; border-radius:999px; font-size:16px; font-weight:800; letter-spacing:.06em; flex:none; }
  .chip.fl{ background:var(--fl); color:var(--fl-ink); }
  .chip.dl{ background:var(--dl); color:var(--dl-ink); }
  .chip.sun{ background:var(--fun); color:#ffffff; }
  .chip.staff{ background:var(--info); color:#ffffff; }
  .chip.other{ background:var(--muted); color:#ffffff; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 20px; overflow:hidden;
    box-shadow:0 1px 4px rgba(24,40,64,.06); }
  .sec-title{ font-size:22px; font-weight:800; letter-spacing:.03em; margin:0 0 10px; display:flex; align-items:center; gap:10px; }
  .sec-title::before{ content:""; width:8px; height:22px; border-radius:4px; background:var(--info); flex:none; }
  .sec-title.warn::before{ background:var(--alert); }
  .sec-title.fun::before{ background:var(--fun); }
  .sec-title .range{ font-size:16px; color:var(--muted); font-weight:600; margin-left:auto; }
  .row{ display:flex; align-items:baseline; gap:12px; font-size:19px; line-height:1.4; }
  .row + .row{ margin-top:9px; }
  .datechip{ flex:none; min-width:98px; text-align:center; background:var(--soft); border:1px solid var(--line);
    border-radius:7px; padding:1px 7px; font-weight:700; font-size:16px; color:var(--muted); }
  .deadline{ color:var(--alert); font-weight:800; white-space:nowrap; }
  .muted{ color:var(--muted); }
  .empty{ color:var(--muted); font-size:17px; }

  #schedule .row{ font-size:26px; }
  #schedule .datechip{ font-size:21px; min-width:120px; }
  .sched-row.past{ opacity:.45; }
  .sched-row.recent{ font-weight:800; }
  .sched-row.recent .datechip{ background:var(--info); border-color:var(--info); color:#ffffff; }

  .fd-reminders .row{ font-size:25px; }
  .fd-reminders .datechip{ font-size:20px; }

  .recruit-panel{ display:flex; flex-direction:column; min-height:0; }
  .recruit-top{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:28px; min-height:0; }
  .recruit-col{ min-height:0; overflow-y:auto; }
  .recruit-col-title{ margin-bottom:8px; }
  .fd-table{ display:flex; flex-direction:column; }
  .fd-table .fd-row{ display:grid; grid-template-columns:110px 1fr; gap:12px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:21px; }
  .fd-table .fd-row:last-child{ border-bottom:none; }
  .fd-table .fd-row.head{ font-size:14px; font-weight:700; color:var(--muted); letter-spacing:.06em; border-bottom:2px solid var(--line); padding-bottom:7px; }
  .fd-table .fd-date{ color:var(--muted); font-weight:700; }

  .recruit-bottom{ flex:none; max-height:220px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line); min-height:0; overflow-y:auto; }
  .recruit-row{ align-items:flex-start; font-size:20px; gap:16px; }
  .recruit-row .datechip{ min-width:110px; font-size:17px; padding:3px 8px; margin-top:2px; }
  .recruit-row .chip{ font-size:16px; padding:2px 11px; }
  .recruit-parts{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; line-height:1.7; }
  .recruit-part{ display:inline-flex; align-items:center; gap:8px; }
  .need{ color:var(--info); font-weight:800; }

  .notice-panel{ display:flex; flex-direction:column; min-height:0; }
  .notice-panel .row{ font-size:22px; }
  .notice-block + .notice-block{ margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
  .notice-block-title{ font-size:15px; font-weight:800; letter-spacing:.06em; margin-bottom:10px;
    display:flex; align-items:center; gap:8px; }
  .notice-block-title::before{ content:""; width:8px; height:8px; border-radius:2px; flex:none; }
  .notice-block.ov .notice-block-title{ color:var(--info); }
  .notice-block.ov .notice-block-title::before{ background:var(--info); }
  .notice-block.tm .notice-block-title{ color:var(--fun); }
  .notice-block.tm .notice-block-title::before{ background:var(--fun); }
  .notice-block.ov #notice-overall .row::before{ content:"・"; color:var(--info); font-weight:800; margin-right:2px; }

  .team-row{ display:grid; grid-template-columns:130px 1fr; align-items:baseline; gap:14px; }
  .team-row .team-name{ font-weight:800; color:var(--fun); font-size:19px; }

  .head{ flex:none; height:76px; display:flex; align-items:center; justify-content:space-between;
    padding:0 30px; background:#ffffff; border-bottom:2px solid var(--line); }
  .head .left{ display:flex; align-items:baseline; gap:16px; }
  .head .clock{ font-size:38px; font-weight:800; line-height:1; }
  .head .clock .colon{ animation:blink 1s step-end infinite; display:inline-block; transform:translateY(-0.1em); }
  @keyframes blink{ 50%{ opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .head .clock .colon{ animation:none; } }
  .head .date{ font-size:22px; color:var(--muted); font-weight:600; }
  .head .now{ display:flex; align-items:center; gap:10px; font-size:21px; font-weight:800; }
  .head .count{ font-size:21px; font-weight:800; display:flex; align-items:baseline; gap:8px; }
  .head .count .label{ color:var(--muted); font-weight:700; }
  .head .count b{ color:var(--alert); font-size:34px; }

  .main{ flex:1; display:grid; grid-template-columns:1fr 2fr; gap:16px; padding:16px 30px; min-height:0; }

  .fd-panel{ display:flex; flex-direction:column; min-height:0; gap:14px; }
  .fd-wrap{ flex:none; display:grid; grid-template-columns:1fr 1.3fr; gap:14px; }
  .fd-reminders{ flex:1; min-height:0; overflow-y:auto; padding-top:14px; border-top:1px solid var(--line); }
  .fd-col h3{ margin:0 0 8px; font-size:16px; font-weight:800; display:flex; align-items:center; gap:6px; color:var(--muted); letter-spacing:.08em; }
  .timeline{ display:flex; flex-direction:column; gap:6px; }
  .tl-item{ display:flex; flex-direction:column; gap:1px; padding:6px 11px; border-radius:8px; border:1px solid var(--line); background:var(--soft); }
  .tl-item .time{ color:var(--muted); font-weight:700; font-size:14px; }
  .tl-item .who{ font-size:18px; font-weight:700; line-height:1.3; }
  .fd-col.fl .tl-item{ background:var(--fl-soft); border-color:var(--fl); }
  .fd-col.dl .tl-item{ background:var(--dl-soft); border-color:var(--dl); }
  .tl-item.done{ opacity:.38; }
  .tl-item.now{ outline:3px solid var(--alert); position:relative; }
  .tl-item.now::after{ content:"NOW"; position:absolute; right:7px; top:6px; font-size:12px; font-weight:800;
    color:#fff; background:var(--alert); border-radius:5px; padding:1px 7px; letter-spacing:.1em; }

  .slides{ position:relative; min-height:0; }
  .slide{ position:absolute; inset:0; display:flex; flex-direction:column; gap:16px; opacity:0; transition:opacity .8s ease; }
  .slide.active{ opacity:1; }
  .slide .cols{ flex:1; display:grid; grid-template-columns:1.3fr 1fr; gap:16px; min-height:0; }
  .slide .colstack{ display:flex; flex-direction:column; gap:16px; min-height:0; }
  .slide .colstack .panel{ min-height:0; overflow-y:auto; }
  .slide .colstack .panel.notice-panel{ flex:1; }
  .slide .panel.full{ flex:1; min-height:0; overflow-y:auto; }
  .slide-dots{ position:absolute; right:6px; bottom:6px; display:flex; gap:9px; }
  .slide-dots i{ width:12px; height:12px; border-radius:50%; background:var(--line); }
  .slide-dots i.on{ background:var(--info); }

  .ticker{ flex:none; height:50px; background:#1d3350; color:#fff; display:flex; align-items:center; overflow:hidden; }
  .ticker .tag{ flex:none; background:rgba(255,255,255,.18); font-weight:800; font-size:18px; padding:0 20px; height:100%; display:flex; align-items:center; }
  .ticker .msg{ font-size:20px; padding:0 22px; white-space:nowrap; }

  @media (prefers-reduced-motion: reduce){ .slide{ transition:none; } }
</style>
</head>
<body>
<div id="screen">
  <div class="head">
    <div class="left">
      <span class="clock num" id="clock">--:--</span>
      <span class="date" id="date"></span>
    </div>
    <div class="now">
      <span class="chip dl">DL</span><span id="now-dl">—</span>
      <span style="width:18px;"></span>
      <span class="chip fl">FL</span><span id="now-fl">—</span>
    </div>
    <div class="count num" id="countdown"></div>
  </div>

  <div class="main">
    <div class="panel fd-panel">
      <h2 class="sec-title">本日の DL / FL</h2>
      <div class="fd-wrap">
        <div class="fd-col dl">
          <h3><span class="chip dl">DL</span></h3>
          <div class="timeline" id="tl-dl"></div>
        </div>
        <div class="fd-col fl">
          <h3><span class="chip fl">FL</span></h3>
          <div class="timeline" id="tl-fl"></div>
        </div>
      </div>
      <div class="fd-reminders">
        <h2 class="sec-title warn">提出リマインド</h2>
        <div id="reminders"></div>
      </div>
    </div>

    <div class="slides">
      <div class="slide active">
        <div class="cols">
          <div class="panel full">
            <h2 class="sec-title">校舎の予定</h2>
            <div id="schedule"></div>
          </div>
          <div class="colstack">
            <div class="panel notice-panel">
              <h2 class="sec-title">校舎からの連絡</h2>
              <div class="notice-block ov">
                <div class="notice-block-title">校舎全体</div>
                <div id="notice-overall"></div>
              </div>
              <div class="notice-block tm">
                <div class="notice-block-title">各班</div>
                <div id="notice-teams"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="slide">
        <div class="panel full recruit-panel">
          <h2 class="sec-title fun">事務募集 <span class="range">お手すきの方はぜひ</span></h2>
          <div class="recruit-top">
            <div class="recruit-col">
              <div class="recruit-col-title"><span class="chip fl">FL</span></div>
              <div class="fd-table" id="recruit-fl"></div>
            </div>
            <div class="recruit-col">
              <div class="recruit-col-title"><span class="chip dl">DL</span></div>
              <div class="fd-table" id="recruit-dl"></div>
            </div>
          </div>
          <div class="recruit-bottom">
            <div class="notice-block-title">その他の募集</div>
            <div id="recruit-staff"></div>
          </div>
        </div>
      </div>

      <div class="slide-dots" id="dots"><i class="on"></i><i></i></div>
    </div>
  </div>

  <div class="ticker">
    <div class="tag" id="ticker-tag"></div>
    <div class="msg" id="ticker-msg"></div>
  </div>
</div>

<script>
let DATA = JSON.parse(<?!= JSON.stringify(initial) ?>);

/* ---------- 画面フィット ---------- */
const screenEl = document.getElementById('screen');
function fit(){
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  screenEl.style.transform = 'scale(' + s + ')';
  screenEl.style.left = ((innerWidth - 1920 * s) / 2) + 'px';
  screenEl.style.top = ((innerHeight - 1080 * s) / 2) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- ユーティリティ ---------- */
function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setRows(id, html){
  document.getElementById(id).innerHTML = html || '<div class="empty">（今日はありません）</div>';
}
const WD = ['日','月','火','水','木','金','土'];

/* ---------- 描画 ---------- */
function render(){
  const d = DATA;

  // カウントダウン
  document.getElementById('countdown').innerHTML = d.countdown
    ? '<span class="label">' + esc(d.countdown.label) + '</span><b>' + d.countdown.days + '</b> 日'
    : '';

  // FL/DL タイムライン
  const tl = list => list.map(x =>
    '<div class="tl-item" data-s="' + esc(x.s) + '" data-e="' + esc(x.e) + '">' +
    '<span class="time num">' + esc(x.s) + '–' + esc(x.e) + '</span>' +
    '<span class="who">' + esc(x.who) + '</span></div>').join('');
  document.getElementById('tl-dl').innerHTML = tl(d.dl) || '<div class="empty">予定なし</div>';
  document.getElementById('tl-fl').innerHTML = tl(d.fl) || '<div class="empty">予定なし</div>';

  // 予定（過ぎたもの=グレー、直近1週間=強調、それ以外=通常）
  setRows('schedule', d.schedule.map(x =>
    '<div class="row sched-row ' + x.status + '">' +
    '<span class="datechip num">' + esc(x.label) + '</span><span>' + esc(x.text) +
    (x.emph ? ' <b class="deadline">締切</b>' : '') + '</span></div>').join(''));

  // リマインド
  setRows('reminders', d.reminders.map(x =>
    '<div class="row"><span>' + (x.target ? '<span class="datechip">' + esc(x.target) + '</span> ' : '') +
    esc(x.text) + '</span><span class="deadline num" style="margin-left:auto;">' + esc(x.due) + '</span></div>').join(''));

  // 校舎からの連絡（全体・各班）
  setRows('notice-overall', d.notices.overall.map(text =>
    '<div class="row"><span>' + esc(text) + '</span></div>').join(''));
  setRows('notice-teams', d.notices.teams.map(x =>
    '<div class="row team-row"><span class="team-name">' + esc(x.team) + '</span><span>' + esc(x.text) + '</span></div>').join(''));

  // FL・DL募集: 上段はFL/DLをそれぞれ軽い表で、下段は日曜日・事務などその他の募集
  const itemText = it => esc(it.content) + (it.count != null ? ' <b class="need">' + esc(it.count) + '人</b>' : '');
  const fdTable = list => '<div class="fd-row head"><span>日付</span><span>時間帯・人数</span></div>' +
    list.map(x => '<div class="fd-row"><span class="fd-date num">' + esc(x.label) + '</span><span>' + itemText(x) + '</span></div>').join('');
  document.getElementById('recruit-fl').innerHTML = d.recruit.fl.length ? fdTable(d.recruit.fl) : '<div class="empty">募集なし</div>';
  document.getElementById('recruit-dl').innerHTML = d.recruit.dl.length ? fdTable(d.recruit.dl) : '<div class="empty">募集なし</div>';

  setRows('recruit-staff', d.recruit.staff.map(g =>
    '<div class="row recruit-row"><span class="datechip num">' + esc(g.label) + '</span>' +
    '<span class="recruit-parts">' + g.parts.map(p =>
      '<span class="recruit-part"><span class="chip ' + esc(p.chipClass) + '">' + esc(p.type) + '</span>' +
      '<span>' + p.items.map(itemText).join(' ／ ') + '</span></span>'
    ).join('') + '</span></div>').join(''));

  tickClock();
}

/* ---------- 時計・NOW判定 ---------- */
function toMin(s){ const p = s.split(':'); return Number(p[0]) * 60 + Number(p[1]); }

// 列内で「まだ終わっていない最初の枠」をNOWにする（枠の間の空き時間も次の枠がNOWのまま）。
// 全部終わっていればNOWなし・全部doneにするだけ。
function updateColumn_(sel, cur){
  const items = document.querySelectorAll(sel + ' .tl-item[data-s]');
  let nowSet = false, who = '—';
  items.forEach(el => {
    const done = cur >= toMin(el.dataset.e);
    el.classList.toggle('done', done);
    const isNow = !done && !nowSet;
    el.classList.toggle('now', isNow);
    if(isNow){ nowSet = true; who = el.querySelector('.who').textContent; }
  });
  return who;
}

function tickClock(){
  const n = new Date();
  document.getElementById('clock').innerHTML =
    String(n.getHours()).padStart(2,'0') + '<span class="colon">:</span>' + String(n.getMinutes()).padStart(2,'0');
  document.getElementById('date').textContent =
    (n.getMonth()+1) + '月' + n.getDate() + '日(' + WD[n.getDay()] + ')';

  const cur = n.getHours() * 60 + n.getMinutes();
  document.getElementById('now-fl').textContent = updateColumn_('#tl-fl', cur);
  document.getElementById('now-dl').textContent = updateColumn_('#tl-dl', cur);
}
setInterval(tickClock, 15000);

/* ---------- スライド ---------- */
let slideIdx = 0;
function rotateSlides(){
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('#dots i');
  slideIdx = (slideIdx + 1) % slides.length;
  slides.forEach((s, j) => s.classList.toggle('active', j === slideIdx));
  dots.forEach((d, j) => d.classList.toggle('on', j === slideIdx));
}
setInterval(rotateSlides, (DATA.config.slideSeconds || 20) * 1000);

/* ---------- テロップ ---------- */
let tickerIdx = 0;
function rotateTicker(){
  const items = DATA.ticker;
  if(!items.length){
    document.getElementById('ticker-tag').textContent = '';
    document.getElementById('ticker-msg').textContent = '';
    return;
  }
  tickerIdx = tickerIdx % items.length;
  document.getElementById('ticker-tag').textContent = items[tickerIdx].tag;
  document.getElementById('ticker-msg').textContent = items[tickerIdx].text;
  tickerIdx++;
}
setInterval(rotateTicker, 12000);

/* ---------- データ再取得・日次リロード ---------- */
function refresh(){
  google.script.run
    .withSuccessHandler(json => { DATA = json; render(); })
    .withFailureHandler(() => {}) // 一時的な失敗は無視して前のデータを出し続ける
    .getData();
}
setInterval(refresh, (DATA.config.refreshMinutes || 5) * 60 * 1000);

// 毎日早朝にページごとリロード（コード更新の取り込みとメモリ掃除）
setInterval(() => {
  const n = new Date();
  if(n.getHours() === 4 && n.getMinutes() === 0) location.reload();
}, 45000);

render();
rotateTicker();
</script>
</body>
</html>
